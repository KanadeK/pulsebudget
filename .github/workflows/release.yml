name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'KanadeK/pulsebudget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Verify, test, and package
        run: uv run python scripts/release_check.py
      - name: Verify tag and release notes
        shell: bash
        run: |
          expected_tag="v$(uv run python -c 'import pulsebudget; print(pulsebudget.__version__)')"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "PulseBudget $GITHUB_REF_NAME"
          --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
